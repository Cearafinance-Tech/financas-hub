name: Ingestao CVM

on:
  schedule:
    # dia 20 dos meses de fechamento trimestral (CVM costuma publicar por volta disso), 06:13 UTC
    - cron: "13 6 20 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      ano_inicial:
        description: "Primeiro ano a ingerir (opcional)"
        required: false
      ano_final:
        description: "Ultimo ano a ingerir (opcional)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ingestion/requirements.txt

      - name: Rodar ingestao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CVM_ANO_INICIAL: ${{ github.event.inputs.ano_inicial }}
          CVM_ANO_FINAL: ${{ github.event.inputs.ano_final }}
        run: python ingestion/ingest_cvm.py
